[package]
name = "cardz"
version = "0.1.0"
description = "Local-first flashcards with folders, git and FSRS"
edition = "2021"

[lib]
name = "cardz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
fsrs = "6.6.2"
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
thiserror = "2.0.21"
ulid = "3.0.0"
walkdir = "2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
